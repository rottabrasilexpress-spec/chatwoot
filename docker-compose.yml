services:
  rails:
    build:
      context: .
      dockerfile: docker/Dockerfile.overlay
    image: rotta-chatwoot:v4.17.0-custom-v1-profile-ai-a67a0712
    env_file:
      - .env
    volumes:
      - storage_data:/app/storage
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    # Database preparation is executed as a deliberate release operation. Running it
    # on every web-container restart can block Puma behind the config reconciliation
    # even when the database is already current.
    command: ["sh", "-c", "exec bundle exec rails s -p 3000 -b 0.0.0.0"]
    restart: always

  sidekiq:
    build:
      context: .
      dockerfile: docker/Dockerfile.overlay
    image: rotta-chatwoot:v4.17.0-custom-v1-profile-ai-a67a0712
    env_file:
      - .env
    volumes:
      - storage_data:/app/storage
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: always

  sidekiq_uazapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.overlay
    image: rotta-chatwoot:v4.17.0-custom-v1-profile-ai-a67a0712
    env_file:
      - .env
    volumes:
      - storage_data:/app/storage
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq-uazapi.yml"]
    restart: always

volumes:
  storage_data:
